[project]
name = "rankguard"
version = "0.1.0"
description = "Evidence-first recommendation evaluation and serving workbench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "certifi>=2025.0.0",
  "fastapi>=0.115.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pydantic>=2.10.0",
  "scipy>=1.14.0",
  "torch>=2.6.0",
  "truststore>=0.10.0",
  "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "playwright>=1.50.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.9.0",
]

[project.scripts]
rankguard-train = "rankguard.pipeline:main"
rankguard-api = "rankguard.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rankguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
